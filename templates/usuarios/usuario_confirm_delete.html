{% extends 'base.html' %}
{% block title %}Eliminar Usuario{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-lg">
            <div class="card-header bg-danger text-white rounded-top-4">
                <h3 class="mb-0 fs-4"><i class="fas fa-trash-alt me-2"></i> Confirmar eliminación</h3>
            </div>
            <div class="card-body text-center p-4">
                <div class="mb-4">
                    <i class="fas fa-user-slash text-danger" style="font-size: 4rem;"></i>
                </div>
                <p class="fs-5">¿Estás seguro de eliminar al usuario <strong class="text-danger">{{ object.username }}</strong>?</p>
                <p class="text-muted">Esta acción es irreversible y eliminará todos los datos asociados.</p>
                <form method="post" class="confirm-delete mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-5 rounded-pill me-2">
                        <i class="fas fa-check-circle me-2"></i> Sí, eliminar
                    </button>
                    <a href="{% url 'usuarios:list' %}" class="btn btn-secondary px-5 rounded-pill">
                        <i class="fas fa-ban me-2"></i> Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
