<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado | Biblioteca BICU</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .error-card:hover {
            transform: translateY(-5px);
        }
        .error-header {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            padding: 2rem;
            text-align: center;
        }
        .error-header i {
            font-size: 4rem;
            color: white;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }
        .error-header h1 {
            color: white;
            font-weight: 800;
            font-size: 3rem;
            margin: 0.5rem 0 0;
            letter-spacing: -1px;
        }
        .error-body {
            padding: 2rem;
            text-align: center;
        }
        .error-body h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1rem;
        }
        .error-body .lead {
            color: #475569;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        .error-body .text-muted {
            color: #64748b;
            font-size: 0.9rem;
        }
        .btn-custom {
            border-radius: 40px;
            padding: 0.6rem 1.5rem;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            color: white;
        }
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(59,130,246,0.3);
            color: white;
        }
        .btn-secondary-custom {
            background: #e2e8f0;
            color: #1e293b;
        }
        .btn-secondary-custom:hover {
            background: #cbd5e1;
            transform: translateY(-2px);
        }
        hr {
            margin: 1.5rem 0;
            border-color: #e2e8f0;
        }
        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        @media (max-width: 576px) {
            .error-body {
                padding: 1.5rem;
            }
            .btn-custom {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-header">
            <i class="fas fa-lock"></i>
            <h1>403</h1>
        </div>
        <div class="error-body">
            <h2>Acceso denegado</h2>
            <p class="lead">No tienes permisos para realizar esta acción.</p>
            <p class="text-muted">
                <i class="fas fa-info-circle me-1"></i> 
                Si crees que esto es un error, contacta al administrador del sistema.
            </p>
            <hr>
            <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
                <a href="{% url 'home' %}" class="btn-custom btn-primary-custom">
                    <i class="fas fa-home"></i> Volver al inicio
                </a>
                <button onclick="history.back()" class="btn-custom btn-secondary-custom">
                    <i class="fas fa-arrow-left"></i> Regresar
                </button>
            </div>
            <div class="footer-note">
                <i class="fas fa-book-open me-1"></i> Biblioteca Central de BICU
            </div>
        </div>
    </div>
</body>
</html>
