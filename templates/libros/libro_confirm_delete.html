{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Confirmar eliminación</h2>
    <p>¿Estás seguro de que deseas eliminar el libro <strong>"{{ object.titulo }}"</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'libros:list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
