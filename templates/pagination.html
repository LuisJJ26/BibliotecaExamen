{% if page_obj.has_other_pages %}
<nav aria-label="Navegación de páginas" class="mt-4">
    <ul class="pagination justify-content-center flex-wrap">
        {% if page_obj.has_previous %}
        <li class="page-item">
            <a class="page-link rounded-pill me-1" href="?page=1{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}{% if request.GET.estado %}&estado={{ request.GET.estado }}{% endif %}" aria-label="Primera">
                <i class="fas fa-angle-double-left"></i>
            </a>
        </li>
        <li class="page-item">
            <a class="page-link rounded-pill me-1" href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}{% if request.GET.estado %}&estado={{ request.GET.estado }}{% endif %}" aria-label="Anterior">
                <i class="fas fa-chevron-left"></i>
            </a>
        </li>
        {% endif %}

        <li class="page-item active">
            <span class="page-link rounded-pill">
                {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}
            </span>
        </li>

        {% if page_obj.has_next %}
        <li class="page-item">
            <a class="page-link rounded-pill ms-1" href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}{% if request.GET.estado %}&estado={{ request.GET.estado }}{% endif %}" aria-label="Siguiente">
                <i class="fas fa-chevron-right"></i>
            </a>
        </li>
        <li class="page-item">
            <a class="page-link rounded-pill" href="?page={{ page_obj.paginator.num_pages }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}{% if request.GET.estado %}&estado={{ request.GET.estado }}{% endif %}" aria-label="Última">
                <i class="fas fa-angle-double-right"></i>
            </a>
        </li>
        {% endif %}
    </ul>
</nav>
{% endif %}
