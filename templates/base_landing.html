<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca BICU{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bicu-blue: #0a2540;
            --bicu-gold: #b68b40;
            --bicu-gold-light: #d4af7a;
            --bicu-dark-blue: #051e34;
            --bicu-light-bg: #f9fafb;
            --bicu-border: #eef2f6;
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background-color: var(--bicu-light-bg);
            color: #1f2d3d;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* ===== NAVBAR ===== */
        .navbar-landing {
            background: var(--bicu-dark-blue);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 0.75rem 0;
        }

        .navbar-landing .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.3px;
            color: var(--bicu-gold-light) !important;
        }

        .navbar-landing .navbar-brand i {
            color: var(--bicu-gold);
        }

        .navbar-landing .btn-acceder {
            border: 1px solid var(--bicu-gold);
            color: var(--bicu-gold);
            background: transparent;
            border-radius: 2rem;
            padding: 0.45rem 1.4rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .navbar-landing .btn-acceder:hover {
            background-color: var(--bicu-gold);
            color: var(--bicu-dark-blue);
        }

        /* ===== CONTENIDO ===== */
        .main-wrapper {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
        }

        .main-content-landing {
            flex: 1 0 auto;
            padding: 2rem 0;
        }

        /* ===== CARDS ===== */
        .card {
            border: none;
            border-radius: 1.25rem;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02), 0 0 0 1px var(--bicu-border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.05), 0 0 0 1px #e2e8f0;
        }

        .btn {
            border-radius: 2rem;
            padding: 0.5rem 1.5rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--bicu-blue);
            border: none;
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--bicu-dark-blue);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(10, 37, 64, 0.2);
        }

        input,
        select,
        textarea {
            border-radius: 0.75rem !important;
            border: 1px solid #e2e8f0 !important;
            padding: 0.6rem 1rem !important;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--bicu-gold) !important;
            box-shadow: 0 0 0 3px rgba(182, 139, 64, 0.15) !important;
        }

        label {
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: var(--bicu-blue);
            font-size: 0.85rem;
        }

        /* ===== FOOTER ===== */
        .footer-note {
            flex-shrink: 0;
            background-color: var(--bicu-dark-blue);
            color: #cdd9f0;
            padding: 1rem 1.5rem;
            text-align: center;
            margin: 0;
            font-size: 0.85rem;
            border-top: 1px solid rgba(182, 139, 64, 0.3);
        }

        @media (max-width: 768px) {
            .main-content-landing {
                padding: 1rem;
            }

            .navbar-landing .navbar-brand {
                font-size: 1.2rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <div class="main-wrapper">
        <nav class="navbar navbar-landing navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">
                    <i class="fas fa-landmark me-2"></i> Biblioteca BICU
                </a>
                <div class="ms-auto">
                    <a href="{% url 'login' %}" class="btn-acceder">
                        <i class="fas fa-sign-in-alt me-1"></i> Acceder
                    </a>
                </div>
            </div>
        </nav>

        <div class="container main-content-landing">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|slice:':1' }} alert-dismissible fade show shadow-sm" role="alert">
                        <i class="fas fa-{% if 'success' in message.tags %}check-circle{% elif 'error' in message.tags %}exclamation-triangle{% else %}info-circle{% endif %} me-2"></i>
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                    </div>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </div>

    <div class="footer-note">
        <p class="mb-0"><i class="fas fa-copyright me-1"></i> {% now "Y" %} Biblioteca BICU | Conectando saberes, construyendo futuro</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                document.querySelectorAll('.alert').forEach(alert => {
                    const bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                });
            }, 5000);
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
